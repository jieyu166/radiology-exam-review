name: Deploy rex-api worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rex-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests (node --test with node:sqlite D1 stub)
        run: npm test

      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=rex-api::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; tests passed, deploy skipped (see docs/account-sync.md)"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply D1 migrations (remote)
        if: steps.secrets.outputs.configured == 'true'
        run: npx wrangler d1 migrations apply rex-progress --remote

      - name: Deploy worker
        if: steps.secrets.outputs.configured == 'true'
        run: npx wrangler deploy

      - name: Verify health
        if: steps.secrets.outputs.configured == 'true' && vars.REX_API_BASE != ''
        run: curl --retry 5 --retry-delay 3 -fsS "${{ vars.REX_API_BASE }}/health"
